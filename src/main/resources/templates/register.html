<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Login | Reaching the Little Sun
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<div
    th:replace="~{fragments/navbar :: navbar}">
</div>


<main class="container py-5">

    <div
        class="form-sun mx-auto"
        style="max-width: 500px;">

        <div class="text-center fs-1">
            ☀️
        </div>

        <h1
            class="section-title
                   text-center mb-2">

            Welcome Back

        </h1>


        <p class="text-center mb-4">

            Keep reaching for your little sun.

        </p>


        <div
            th:if="${param.error}"
            class="alert alert-danger">

            Invalid username or password.

        </div>


        <div
            th:if="${param.logout}"
            class="alert alert-success">

            You have been logged out.

        </div>


        <div
            th:if="${param.registered}"
            class="alert alert-success">

            Account created successfully!
            You can log in now. ☀️

        </div>


        <form
            th:action="@{/login}"
            method="post">


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-sun
                       btn-lg w-100">

                ☀️ Login

            </button>

        </form>


        <p class="text-center mt-4">

            Don't have an account?

            <a th:href="@{/register}">
                Register here
            </a>

        </p>

    </div>

</main>

</body>
</html>
