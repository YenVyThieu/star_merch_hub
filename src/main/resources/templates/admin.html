<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Admin | Reaching the Little Sun
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<div
    th:replace="~{fragments/navbar :: navbar}">
</div>


<main class="container py-5">

    <div class="mb-5">

        <h1 class="section-title">
            ☀️ Admin Sunroom
        </h1>

        <p class="lead">
            Manage products and view users.
        </p>

    </div>


    <section class="form-sun mb-5">

        <div
            class="d-flex
                   justify-content-between
                   align-items-center mb-3">

            <h2>
                Products
            </h2>

            <a
                class="btn btn-sun"
                th:href="@{/products/new}">
                + Add Product
            </a>

        </div>


        <div class="table-responsive">

            <table
                class="table
                       table-hover
                       align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Artist</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>

                </thead>


                <tbody>

                    <tr
                        th:each="product : ${products}">

                        <td
                            th:text="${product.productId}">
                        </td>

                        <td
                            th:text="${product.name}">
                        </td>

                        <td
                            th:text="${product.artist.displayName}">
                        </td>

                        <td>
                            $
                            <span
                                th:text="${product.price}">
                            </span>
                        </td>


                        <td>

                            <a
                                class="btn
                                       btn-sm
                                       btn-warning"
                                th:href="@{/products/{id}/edit(
                                    id=${product.productId}
                                )}">

                                Edit

                            </a>


                            <form
                                class="d-inline"
                                th:action="@{/products/{id}/delete(
                                    id=${product.productId}
                                )}"
                                method="post">

                                <button
                                    class="btn
                                           btn-sm
                                           btn-danger"
                                    type="submit">

                                    Delete

                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <section class="form-sun">

        <h2 class="mb-3">
            Registered Users
        </h2>


        <div class="table-responsive">

            <table
                class="table
                       table-hover">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>

                </thead>


                <tbody>

                    <tr
                        th:each="user : ${users}">

                        <td
                            th:text="${user.userId}">
                        </td>

                        <td
                            th:text="${user.username}">
                        </td>

                        <td
                            th:text="${user.email}">
                        </td>

                        <td>

                            <span
                                class="badge text-bg-warning"
                                th:text="${user.role}">
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>
</html>
