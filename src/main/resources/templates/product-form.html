<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Product | Reaching the Little Sun</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-sun">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            ☀️ Reaching the Little Sun
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" th:href="@{/}">
                Home
            </a>

            <a class="nav-link" th:href="@{/products}">
                Products
            </a>

            <a class="nav-link" th:href="@{/products/new}">
                Add Product
            </a>

            <a class="nav-link" th:href="@{/artists}">
                Artists
            </a>

            <a class="nav-link" th:href="@{/about}">
                About
            </a>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="form-sun mx-auto" style="max-width: 750px;">

        <div class="text-center fs-1">
            ☀️
        </div>

        <h1 class="section-title text-center mb-4">
            Add a New Little Sun
        </h1>


        <form
            th:action="@{/products}"
            th:object="${product}"
            method="post"
        >


            <div class="mb-3">

                <label class="form-label">
                    Product Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    th:field="*{name}"
                    placeholder="Golden Lightstick"
                >

                <div
                    class="text-danger"
                    th:errors="*{name}">
                </div>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    th:field="*{description}">
                </textarea>

                <div
                    class="text-danger"
                    th:errors="*{description}">
                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        step="0.01"
                        min="0.01"
                        th:field="*{price}"
                    >

                    <div
                        class="text-danger"
                        th:errors="*{price}">
                    </div>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        SKU
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{stockKeepingUnit}"
                        placeholder="BTS-LS-001"
                    >

                    <div
                        class="text-danger"
                        th:errors="*{stockKeepingUnit}">
                    </div>

                </div>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Artist
                    </label>

                    <select
                        class="form-select"
                        th:field="*{artist}"
                    >

                        <option value="">
                            Select Artist
                        </option>

                        <option
                            th:each="artist : ${artists}"
                            th:value="${artist}"
                            th:text="${artist.displayName}">
                        </option>

                    </select>

                    <div
                        class="text-danger"
                        th:errors="*{artist}">
                    </div>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        class="form-select"
                        th:field="*{category}"
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option
                            th:each="category : ${categories}"
                            th:value="${category}"
                            th:text="${category.displayName}">
                        </option>

                    </select>

                    <div
                        class="text-danger"
                        th:errors="*{category}">
                    </div>

                </div>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Image URL
                </label>

                <input
                    type="url"
                    class="form-control"
                    th:field="*{imageUrl}"
                    placeholder="Optional"
                >

                <div
                    class="text-danger"
                    th:errors="*{imageUrl}">
                </div>

            </div>


            <button
                type="submit"
                class="btn btn-sun w-100 btn-lg"
            >
                ☀️ Add Product
            </button>


        </form>

    </div>

</main>


<footer>
    Reaching the Little Sun ☀️
</footer>

</body>

</html>
