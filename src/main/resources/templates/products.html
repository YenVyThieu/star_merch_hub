<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Products | Reaching the Little Sun</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="section-title mb-1">
                Little Suns ☀️
            </h1>

            <p class="mb-0">
                Find something from the stars you love.
            </p>

        </div>

        <a
            class="btn btn-sun"
            th:href="@{/products/new}"
        >
            + Add Product
        </a>

    </div>


    <div
        th:if="${successMessage}"
        class="alert alert-warning"
        th:text="${successMessage}">
    </div>


    <div class="form-sun mb-4">

        <form
            method="get"
            th:action="@{/products}"
            class="row g-3"
        >


            <div class="col-md-4">

                <label class="form-label">
                    Artist
                </label>

                <select
                    class="form-select"
                    name="artist"
                >

                    <option value="">
                        All Artists
                    </option>

                    <option
                        th:each="artist : ${artists}"
                        th:value="${artist}"
                        th:text="${artist.displayName}"
                        th:selected="${artist == selectedArtist}">
                    </option>

                </select>

            </div>


            <div class="col-md-4">

                <label class="form-label">
                    Category
                </label>

                <select
                    class="form-select"
                    name="category"
                >

                    <option value="">
                        All Categories
                    </option>

                    <option
                        th:each="category : ${categories}"
                        th:value="${category}"
                        th:text="${category.displayName}"
                        th:selected="${category == selectedCategory}">
                    </option>

                </select>

            </div>


            <div class="col-md-4">

                <label class="form-label">
                    Sort
                </label>

                <select
                    class="form-select"
                    name="sort"
                >

                    <option
                        value="nameAsc"
                        th:selected="${sort == 'nameAsc'}">
                        Name A → Z
                    </option>

                    <option
                        value="nameDesc"
                        th:selected="${sort == 'nameDesc'}">
                        Name Z → A
                    </option>

                    <option
                        value="priceAsc"
                        th:selected="${sort == 'priceAsc'}">
                        Price Low → High
                    </option>

                    <option
                        value="priceDesc"
                        th:selected="${sort == 'priceDesc'}">
                        Price High → Low
                    </option>

                    <option
                        value="createdDesc"
                        th:selected="${sort == 'createdDesc'}">
                        Newest
                    </option>

                </select>

            </div>


            <div class="col-12">

                <button class="btn btn-sun">
                    Search & Sort
                </button>

                <a
                    class="btn btn-outline-secondary"
                    th:href="@{/products}"
                >
                    Clear
                </a>

            </div>

        </form>

    </div>


    <div
        th:if="${productPage.empty}"
        class="text-center py-5"
    >

        <div class="fs-1">
            🌥️
        </div>

        <h3>
            No little suns found.
        </h3>

        <p>
            Try another artist or category.
        </p>

    </div>


    <div class="row g-4">

        <div
            class="col-md-6 col-lg-4"
            th:each="product : ${productPage.content}"
        >

            <article class="card card-sun h-100">


                <div
                    class="sun-placeholder"
                    th:if="${#strings.isEmpty(product.imageUrl)}"
                >
                    ☀️
                </div>


                <img
                    class="product-image"
                    th:unless="${#strings.isEmpty(product.imageUrl)}"
                    th:src="${product.imageUrl}"
                    th:alt="${product.name}"
                >


                <div class="card-body">

                    <span
                        class="badge badge-sun mb-2"
                        th:text="${product.category.displayName}">
                    </span>

                    <h3
                        class="h5"
                        th:text="${product.name}">
                    </h3>

                    <p
                        class="small"
                        th:text="${product.description}">
                    </p>

                    <p class="mb-1">

                        <strong>
                            Artist:
                        </strong>

                        <span
                            th:text="${product.artist.displayName}">
                        </span>

                    </p>

                    <p class="mb-1">

                        <strong>
                            SKU:
                        </strong>

                        <span
                            th:text="${product.stockKeepingUnit}">
                        </span>

                    </p>

                    <p class="fs-4 fw-bold mt-3">

                        $

                        <span
                            th:text="${product.price}">
                        </span>
                        <div
                            th:if="${isStaffOrAdmin}"
                            class="mt-3">

                            <a
                                class="btn btn-warning"
                                th:href="@{/products/{id}/edit(
                                    id=${product.productId}
                                )}">

                                Edit

                            </a>


                            <form
                                th:if="${isAdmin}"
                                class="d-inline"
                                th:action="@{/products/{id}/delete(
                                    id=${product.productId}
                                )}"
                                method="post">

                                <button
                                    type="submit"
                                    class="btn btn-danger">

                                    Delete

                                </button>

                            </form>

                        </div>  
                    </p>

                </div>

            </article>

        </div>

    </div>


    <nav
        class="mt-5"
        th:if="${productPage.totalPages > 1}"
    >

        <ul class="pagination justify-content-center">

            <li
                class="page-item"
                th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                th:classappend="${i == productPage.number} ? 'active'"
            >

                <a
                    class="page-link"
                    th:href="@{/products(
                        page=${i},
                        artist=${selectedArtist},
                        category=${selectedCategory},
                        sort=${sort}
                    )}"
                    th:text="${i + 1}">
                </a>

            </li>

        </ul>

    </nav>

</main>


<footer>
    ☀️ Reaching the Little Sun
</footer>

</body>

</html>
