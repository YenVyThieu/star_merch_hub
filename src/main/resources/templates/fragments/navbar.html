<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<nav
    th:fragment="navbar"
    class="navbar navbar-expand-lg navbar-sun">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/}">
            ☀️ Reaching the Little Sun
        </a>


        <div class="navbar-nav ms-auto
                    align-items-lg-center">

            <a
                class="nav-link"
                th:href="@{/}">
                Home
            </a>

            <a
                class="nav-link"
                th:href="@{/products}">
                Products
            </a>


            <a
                th:if="${isStaffOrAdmin}"
                class="nav-link"
                th:href="@{/products/new}">
                Add Product
            </a>


            <a
                class="nav-link"
                th:href="@{/artists}">
                Artists
            </a>

            <a
                class="nav-link"
                th:href="@{/about}">
                About
            </a>


            <a
                th:if="${isAdmin}"
                class="nav-link fw-bold"
                th:href="@{/admin}">
                Admin
            </a>


            <a
                th:if="${!loggedIn}"
                class="nav-link"
                th:href="@{/login}">
                Login
            </a>

            <a
                th:if="${!loggedIn}"
                class="nav-link"
                th:href="@{/register}">
                Register
            </a>


            <span
                th:if="${loggedIn}"
                class="navbar-text ms-lg-3 me-2">

                ☀️ Hi,
                <strong
                    th:text="${currentUsername}">
                </strong>

                <span class="small">
                    (
                    <span
                        th:text="${currentRole}">
                    </span>
                    )
                </span>

            </span>


            <form
                th:if="${loggedIn}"
                th:action="@{/logout}"
                method="post"
                class="d-inline">

                <button
                    class="btn btn-sm btn-outline-dark"
                    type="submit">
                    Logout
                </button>

            </form>

        </div>

    </div>

</nav>

</body>
</html>
